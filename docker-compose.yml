services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      APP_A_POSTGRES_DB: ${APP_A_POSTGRES_DB:?APP_A_POSTGRES_DB is required}
      APP_B_POSTGRES_DB: ${APP_B_POSTGRES_DB:?APP_B_POSTGRES_DB is required}
    command: >
      sh -ec '
        for db in "$$APP_A_POSTGRES_DB" "$$APP_B_POSTGRES_DB"; do
          if psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "select 1 from pg_database where datname = '\''$$db'\''" | grep -q 1; then
            echo "Database $$db already exists";
          else
            createdb -h postgres -U "$$POSTGRES_USER" "$$db";
          fi;
        done
      '
    depends_on:
      postgres:
        condition: service_healthy

  db-setup:
    build:
      context: .
    command: npm run db:setup
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL_DOCKER:?AUTH_DATABASE_URL_DOCKER is required}
      APP_A_DATABASE_URL: ${APP_A_DATABASE_URL_DOCKER:?APP_A_DATABASE_URL_DOCKER is required}
      APP_B_DATABASE_URL: ${APP_B_DATABASE_URL_DOCKER:?APP_B_DATABASE_URL_DOCKER is required}
      APP_CLIENT_SECRET: ${APP_CLIENT_SECRET:?APP_CLIENT_SECRET is required}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?SEED_USER_PASSWORD is required}
    depends_on:
      db-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-provider-server:
    build:
      context: .
    command: npm run dev:auth
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${AUTH_DATABASE_URL_DOCKER:?AUTH_DATABASE_URL_DOCKER is required}
      RABBITMQ_URL: amqp://rabbitmq:5672
      INTERNAL_LOGOUT_TOKEN: ${INTERNAL_LOGOUT_TOKEN:?INTERNAL_LOGOUT_TOKEN is required}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:?MFA_SECRET_ENCRYPTION_KEY is required}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  control-panel:
    build:
      context: .
    command: npm run dev:control-panel
    environment:
      PORT: 3004
      HOST: 0.0.0.0
      DATABASE_URL: ${AUTH_DATABASE_URL_DOCKER:?AUTH_DATABASE_URL_DOCKER is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      auth-provider-server:
        condition: service_started

  sync-worker:
    build:
      context: .
    command: npm run dev:worker
    environment:
      PORT: 3003
      HOST: 0.0.0.0
      DATABASE_URL: ${AUTH_DATABASE_URL_DOCKER:?AUTH_DATABASE_URL_DOCKER is required}
      RABBITMQ_URL: amqp://rabbitmq:5672
      INTERNAL_LOGOUT_TOKEN: ${INTERNAL_LOGOUT_TOKEN:?INTERNAL_LOGOUT_TOKEN is required}
      REVOCATION_QUEUE_NAME: revocation.deliveries
      REVOCATION_DLQ_NAME: revocation.deliveries.dlq
      OUTBOX_PUBLISH_INTERVAL_MS: 1000
      MAX_DELIVERY_ATTEMPTS: 5
      PROCESSING_TIMEOUT_MS: 300000
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  app-a:
    build:
      context: .
    command: npm run dev:app-a
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      APPLICATION_ID: app-a
      APP_DISPLAY_NAME: App A
      APP_BASE_URL: http://localhost:3001
      AUTH_PROVIDER_PUBLIC_URL: http://localhost:3000
      AUTH_PROVIDER_INTERNAL_URL: http://auth-provider-server:3000
      CLIENT_ID: app-a
      CLIENT_SECRET: ${APP_CLIENT_SECRET:?APP_CLIENT_SECRET is required}
      DATABASE_URL: ${APP_A_DATABASE_URL_DOCKER:?APP_A_DATABASE_URL_DOCKER is required}
      INTERNAL_LOGOUT_TOKEN: ${INTERNAL_LOGOUT_TOKEN:?INTERNAL_LOGOUT_TOKEN is required}
    ports:
      - "3001:3001"
    depends_on:
      auth-provider-server:
        condition: service_started
      db-setup:
        condition: service_completed_successfully

  app-b:
    build:
      context: .
    command: npm run dev:app-b
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      APPLICATION_ID: app-b
      APP_DISPLAY_NAME: App B
      APP_BASE_URL: http://localhost:3002
      AUTH_PROVIDER_PUBLIC_URL: http://localhost:3000
      AUTH_PROVIDER_INTERNAL_URL: http://auth-provider-server:3000
      CLIENT_ID: app-b
      CLIENT_SECRET: ${APP_CLIENT_SECRET:?APP_CLIENT_SECRET is required}
      DATABASE_URL: ${APP_B_DATABASE_URL_DOCKER:?APP_B_DATABASE_URL_DOCKER is required}
      INTERNAL_LOGOUT_TOKEN: ${INTERNAL_LOGOUT_TOKEN:?INTERNAL_LOGOUT_TOKEN is required}
    ports:
      - "3002:3002"
    depends_on:
      auth-provider-server:
        condition: service_started
      db-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
